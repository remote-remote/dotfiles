clear_all_shortcuts no

env BIN_PATH=$HOME/.nix-profile/bin/ 

include ~/.config/kitty/kitty-themes/themes/vague.conf

enabled_layouts splits,stack

macos_option_as_alt yes

paste_actions no-op

# font_family      family="FiraCode Nerd Font Mono" style=Light
# font_family      family="ZedMono Nerd Font Mono" style=Light
# font_family      family="JetBrainsMono Nerd Font Mono"
# font_family      family="Hack Nerd Font Mono" style=Regular
# font_family family="ProggyClean Nerd Font Mono"
# font_family family="Iosevka Nerd Font Mono" style=Regular
# font_family family="Monoid Nerd Font Mono" style=Regular
font_family      family="Inconsolata Nerd Font Mono"

bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0

allow_remote_control yes
listen_on unix:/tmp/mykitty

tab_bar_edge top
# tab_bar_margin_height 5.0 1.0
# tab_bar_style fade
# tab_bar_min_tabs 1
# tab_bar_background #232A2E

# background_opacity 1
# background_image background.webp
# background_tint 0.995
# inactive_text_alpha 0.9

hide_window_decorations yes

modify_keyboard_protocol no

globinclude dynamic/*.conf 
