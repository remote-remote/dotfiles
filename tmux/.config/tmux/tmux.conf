set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'RyanMillerC/better-vim-tmux-resizer'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-strategy-nvim 'session'
# set -g @continuum-save-interval '60'
# set -g @continuum-restore 'on'

set-environment -g -u __HM_SESS_VARS_SOURCED

set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g set-titles on
set-option -g status on
set-option -g status-position top

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind x kill-pane

bind l next-window
bind h previous-window

bind T command-prompt -I "#W" "rename-window -- '%%'"
bind P command-prompt -I "#{pane_title}" "select-pane -T '%%'"

bind b run-shell "workmux sidebar" 
bind G display-popup -E -w 25 -h 5 "workmux-add"

TMUX_FZF_LAUNCH_KEY="C-f"

set-option -g mouse on
setw -g mode-keys vi

set -g popup-border-lines rounded
bind-key f display-popup -E -w 80% -h 70% -T " sessions " "~/.local/bin/tmux-picker"
bind-key s display-popup -E -w 80% -h 70% -T " sessions " "~/.local/bin/tmux-picker"

bind g display-popup -E -w 80% -h 80% lazygit

# in tmux.conf
bind-key n switch-client -T g_keys
bind-key -T g_keys d display-popup -E "flow note daily"
bind-key -T g_keys t display-popup -E "flow note task"
bind-key -T g_keys n display-popup -E "flow"
bind-key -T g_keys r display-popup -E "flow reminder"

# keep at bottom
run '~/.config/tmux/plugins/tpm/tpm'

# ── vague theme ───────────────────────────────────────────────
# Must follow tpm: plugins can override status options.

set -g status-position top
set -g status on
set -g message-line 0
set -g status-interval 60
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 40

set -g status-style "fg=#606079,bg=#1c1c24"
set -g status-left-style "fg=#606079,bg=#1c1c24"
set -g status-right-style "fg=#606079,bg=#1c1c24"
set -g status-left "#[fg=#cdcdcd,bg=#405065,bold] #S #[fg=#606079,bg=#1c1c24,nobold] "
set -g status-right "#H "

setw -g window-status-separator ""
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=#8ba9c1,bg=#1c1c24"
setw -g window-status-current-style "fg=#141415,bg=#8ba9c1"
setw -g window-status-activity-style "fg=#f3be7c,bg=#1c1c24"
setw -g window-status-bell-style "fg=#d8647e,bg=#1c1c24"

setw -g pane-border-style "fg=#405065"
setw -g pane-active-border-style "fg=#6e94b2"

# tmux's stock pane-border-format appends clickable [z]/[x] mouse controls
# whenever `mouse` is on. Keep index and title, drop the controls.
setw -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}"'

# The prompt draws over the bar instead of taking a row of its own; constraining
# its width leaves the statusbar readable on either side of it.
# message-command-style needs the same treatment:
# message-format switches to it whenever command_prompt is set, which is exactly
# the `:` prompt.
set -g message-style "fg=#141415,bg=#6e94b2,fill=#6e94b2,align=centre,width=50%"
set -g message-command-style "fg=#141415,bg=#6e94b2,fill=#6e94b2,align=centre,width=50%"

set -g popup-style "bg=#000000"
set -g popup-border-style "fg=#606079"
set -g menu-style "fg=#cdcdcd,bg=#141415"
set -g menu-selected-style "fg=#141415,bg=#6e94b2"
set -g menu-border-style "fg=#606079"

setw -g mode-style "fg=#cdcdcd,bg=#405065"
setw -g copy-mode-match-style "bg=#405065"
setw -g copy-mode-current-match-style "fg=#141415,bg=#f3be7c"
setw -g copy-mode-mark-style "fg=#141415,bg=#bb9dbd"

setw -g clock-mode-colour "#6e94b2"
setw -g clock-mode-style 24
set -g display-panes-colour "#606079"
set -g display-panes-active-colour "#6e94b2"
